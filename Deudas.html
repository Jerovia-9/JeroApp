<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado de Pagos · Jerovia N°9</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8f6f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      color: #1a1a1a;
    }
    .rainbow-bar {
      width: 100%;
      max-width: 820px;
      height: 4px;
      border-radius: 20px 20px 0 0;
      background: linear-gradient(90deg,
          #D8303B, #F58634, #FFE61C, #00A859, #00AFEF, #0065A0, #727CB6);
      background-size: 300% 100%;
      animation: arcoirisMove 6s ease-in-out infinite alternate;
      opacity: 0.5;
    }
    @keyframes arcoirisMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .container {
      max-width: 820px;
      width: 100%;
      background: white;
      border-radius: 0 0 32px 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.04);
      padding: 2rem 2rem 1.5rem;
      border: 1px solid #f0ecee;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header .subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.7rem;
      color: #d63384;
      background: rgba(214, 51, 132, 0.06);
      display: inline-block;
      padding: 0.2rem 1.2rem;
      border-radius: 30px;
      margin-bottom: 0.5rem;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2.4rem;
      color: #1a1a1a;
      line-height: 1.1;
      margin-bottom: 0.2rem;
    }
    .header h1 span {
      background: linear-gradient(135deg, #d63384, #b82a6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .tagline {
      font-weight: 300;
      font-size: 0.9rem;
      color: #7a6a72;
      letter-spacing: 0.3px;
    }
    .header .tagline strong {
      font-weight: 600;
      color: #d63384;
    }
    .search-section {
      background: #faf8f9;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
    }
    .search-section p {
      font-size: 0.9rem;
      font-weight: 400;
      color: #5a4a52;
      margin-bottom: 1rem;
    }
    .search-box {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: center;
    }
    .input-wrapper {
      flex: 1 1 280px;
      position: relative;
    }
    .input-wrapper input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.8rem;
      border: 1.5px solid #e8e2e5;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      background: white;
      transition: 0.25s;
      outline: none;
      color: #1a1a1a;
    }
    .input-wrapper input:focus {
      border-color: #d63384;
      box-shadow: 0 0 0 3px rgba(214,51,132,0.06);
    }
    .input-wrapper .icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0.4;
      pointer-events: none;
    }
    .btn-consultar {
      background: linear-gradient(135deg, #d63384, #b82a6e);
      color: white;
      border: none;
      padding: 0.7rem 2rem;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 4px 16px rgba(214,51,132,0.1);
    }
    .btn-consultar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(214,51,132,0.15);
    }
    .btn-consultar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #resultado {
      margin-top: 0.5rem;
      min-height: 100px;
      transition: all 0.4s ease;
    }
    .result-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      border: 1px solid #f0ecee;
      animation: fadeSlideUp 0.5s ease forwards;
      text-align: left;
    }
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .result-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      border-bottom: 1px solid #f0ecee;
      padding-bottom: 1rem;
    }
    .result-header .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fce4ec;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #d63384;
      flex-shrink: 0;
    }
    .result-header .name-group {
      flex: 1;
    }
    .result-header .name-group .nombre {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: #1a1a1a;
    }
    .result-header .name-group .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a08a94;
      font-weight: 500;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status-badge.warning {
      background: #fff3e0;
      color: #e65100;
    }
    .status-badge.danger {
      background: #ffebee;
      color: #c62828;
    }
    .result-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .result-body .item {
      background: #faf8f9;
      border-radius: 12px;
      padding: 0.7rem 1rem;
    }
    .result-body .item .label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a08a94;
      font-weight: 500;
    }
    .result-body .item .value {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-top: 0.1rem;
    }
    .result-body .item .value.deuda {
      color: #d63384;
    }
    .result-body .item .value.mes {
      color: #4a4a4a;
      font-weight: 400;
    }
    .alert-box {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      background: #fff3f5;
      border-left: 4px solid #d63384;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      color: #b82a6e;
      font-size: 0.85rem;
    }
    .alert-box .icono {
      font-size: 1.6rem;
    }
    .no-result {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      border: 1px dashed #e0cdd6;
    }
    .no-result .icono {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      opacity: 0.5;
    }
    .no-result p {
      color: #7a6a72;
      font-size: 0.9rem;
    }
    .no-result p strong {
      color: #d63384;
      font-weight: 600;
    }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #f3d9e4;
      border-radius: 50%;
      border-top-color: #d63384;
      animation: spin 0.8s linear infinite;
      margin: 0.5rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: #7a6a72;
      font-size: 0.9rem;
    }
    .footer {
      max-width: 820px;
      width: 100%;
      margin-top: 2rem;
      text-align: center;
      font-size: 0.7rem;
      color: #b8b0b4;
      border-top: 1px solid #f0ecee;
      padding: 1.2rem 1.5rem 0.5rem;
      letter-spacing: 0.3px;
    }
    .footer .rainbow-dots {
      display: inline-flex;
      gap: 5px;
      margin-bottom: 0.2rem;
    }
    .footer .rainbow-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      opacity: 0.6;
    }
    .footer strong {
      color: #d63384;
      font-weight: 500;
    }
    @media (max-width: 640px) {
      .container {
        padding: 1rem;
        border-radius: 0 0 24px 24px;
      }
      .header h1 {
        font-size: 2rem;
      }
      .search-section {
        padding: 1rem;
      }
      .result-body {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
      .result-header {
        flex-wrap: wrap;
      }
      .result-header .name-group .nombre {
        font-size: 1.2rem;
      }
      .btn-consultar {
        width: 100%;
        justify-content: center;
        padding: 0.7rem 1.5rem;
      }
      .input-wrapper input {
        padding-left: 2.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="rainbow-bar"></div>

  <div class="container">

    <header class="header">
      <div class="subtitle">✦ Asamblea Jerovia N°9 ✦</div>
      <h1>Estado de <span>Pagos</span></h1>
      <p class="tagline">Revisa tu <strong>deuda</strong> · Tesorería Jerovia</p>
    </header>

    <section class="search-section">
      <p>🔍 Escribí tu nombre de usuario (la inicial de tu nombre + tu apellido en minúsculas sin acento)</p>
      <div class="search-box">
        <div class="input-wrapper">
          <input type="text" id="nombre" placeholder="Ej: svolpe" autocomplete="off" />
          <span class="icon">❤️</span>
        </div>
        <button class="btn-consultar" id="btnBuscar">Consultar</button>
      </div>
    </section>

    <div id="resultado"></div>

  </div>

  <footer class="footer">
    <div class="rainbow-dots">
      <span style="background:#D8303B;"></span>
      <span style="background:#F58634;"></span>
      <span style="background:#FFE61C;"></span>
      <span style="background:#00A859;"></span>
      <span style="background:#00AFEF;"></span>
      <span style="background:#0065A0;"></span>
      <span style="background:#727CB6;"></span>
    </div>
    <p>
      Orden Internacional del Arcoíris para Niñas · <strong>Asamblea Jerovia N°9</strong> · Paraguay
    </p>
    <p style="margin-top:0.2rem; opacity:0.4; font-size:0.6rem;">&copy; 2026 · Sol Isabella Volpe</p>
  </footer>

  <script>
    // ---------- CONFIGURACIÓN ----------
    const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxE2Bne2Sg_YiMpskNCD0Ke1ac_tEDF-Ul86ScA3tx_gVZS6R6CowMsTlNJ3_VrXRKc9sLTkwi5sw4/pub?gid=0&single=true&output=csv";

    const corazones = ['❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '🤎', '💖', '💗', '💘', '💝'];
    function obtenerCorazonAleatorio() {
      return corazones[Math.floor(Math.random() * corazones.length)];
    }

    function normalizarTexto(texto) {
      return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function limpiarNumero(valor) {
      if (!valor || valor === "") return 0;
      let str = valor.toString().trim();
      str = str.replace(/\./g, '');
      str = str.replace(/,/g, '.');
      const num = parseFloat(str);
      return isNaN(num) ? 0 : num;
    }

    function parseCSV(texto) {
      const filas = [];
      let filaActual = [];
      let campoActual = "";
      let dentroComillas = false;

      for (let i = 0; i < texto.length; i++) {
        const char = texto[i];
        const nextChar = texto[i + 1];

        if (dentroComillas) {
          if (char === '"') {
            if (nextChar === '"') {
              campoActual += '"';
              i++;
            } else {
              dentroComillas = false;
            }
          } else {
            campoActual += char;
          }
        } else {
          if (char === '"') {
            dentroComillas = true;
          } else if (char === ',') {
            filaActual.push(campoActual.trim());
            campoActual = "";
          } else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
            if (char === '\r') i++;
            filaActual.push(campoActual.trim());
            filas.push(filaActual);
            filaActual = [];
            campoActual = "";
          } else {
            campoActual += char;
          }
        }
      }
      if (campoActual !== "" || filaActual.length > 0) {
        filaActual.push(campoActual.trim());
        filas.push(filaActual);
      }

      if (filas.length === 0) return { headers: [], rows: [] };
      const headers = filas[0].map(h => h.trim().toLowerCase());
      const rows = filas.slice(1);
      return { headers, rows };
    }

    async function cargarDatos() {
      try {
        const respuesta = await fetch(urlCSV);
        if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
        const texto = await respuesta.text();
        console.log("CSV recibido (primeros 200 caracteres):", texto.substring(0, 200));

        const { headers, rows } = parseCSV(texto);
        console.log("Encabezados detectados:", headers);

        const idxNombre = headers.findIndex(h => h.includes('nombre'));
        const idxUser = headers.findIndex(h => h.includes('user'));
        const idxDeuda = headers.findIndex(h => h.includes('total deuda') || h.includes('total_deuda'));
        const idxUltimoMes = headers.findIndex(h => h.includes('último mes pagado') || h.includes('ultimo mes pagado'));
        const idxObs = headers.findIndex(h => h.includes('observaciones'));

        if (idxNombre === -1) throw new Error("No se encontró columna 'nombre'");
        if (idxUser === -1) {
          console.warn("No se encontró columna 'user'. Se usará 'nombre' para búsqueda.");
        } else {
          console.log(`Columna 'user' encontrada en posición ${idxUser}. Primer valor: "${rows[0]?.[idxUser] || ''}"`);
        }

        const datos = rows.map(row => ({
          nombre: (row[idxNombre] || '').trim(),
          user: (idxUser !== -1 ? (row[idxUser] || '').trim() : ''),
          deuda: (idxDeuda !== -1 ? (row[idxDeuda] || '0') : '0'),
          ultimoMes: (idxUltimoMes !== -1 ? (row[idxUltimoMes] || '') : ''),
          observacion: (idxObs !== -1 ? (row[idxObs] || '') : '')
        }));

        console.log(`Se cargaron ${datos.length} registros. Ejemplo:`, datos[0]);
        return datos;
      } catch (error) {
        console.error("Error al cargar datos:", error);
        return null;
      }
    }

    function renderResultado(hermana, corazon, busquedaPorUser = true) {
      const div = document.getElementById('resultado');

      if (!hermana) {
        div.innerHTML = `
          <div class="no-result">
            <div class="icono">🔎</div>
            <p>No encontramos a ninguna hermana con ese usuario.</p>
            <p style="font-size:0.8rem; margin-top:0.3rem;">Verificá que tu <strong>nombre de usuario</strong> esté bien escrito (sin acentos, todo minúscula).</p>
            <p style="font-size:0.7rem; margin-top:0.2rem; color:#b8a4ae;">Búsqueda por ${busquedaPorUser ? 'columna user' : 'nombre'}</p>
          </div>
        `;
        return;
      }

      const deudaNum = limpiarNumero(hermana.deuda);
      const deudaFormateada = deudaNum.toLocaleString('es-PY', { style: 'currency', currency: 'PYG' });

      let badgeClass = 'success';
      let badgeText = '✅ Al día';
      if (deudaNum > 500000) {
        badgeClass = 'danger';
        badgeText = '⚠️ Deuda alta';
      } else if (deudaNum > 0) {
        badgeClass = 'warning';
        badgeText = '⏳ Pendiente';
      }

      let alertHTML = '';
      if (deudaNum > 500000) {
        alertHTML = `
          <div class="alert-box">
            <span class="icono">📢</span>
            <span><strong>Comunicate con la tesorera, la Ilustre Preceptora o la Madre Preceptora</strong> — tu deuda supera los Gs. 500.000.</span>
          </div>
        `;
      }

      div.innerHTML = `
        <div class="result-card">
          <div class="result-header">
            <div class="avatar">${corazon}</div>
            <div class="name-group">
              <div class="nombre">${hermana.nombre}</div>
              <div class="label">Hermana de la Asamblea</div>
            </div>
            <span class="status-badge ${badgeClass}">${badgeText}</span>
          </div>

          <div class="result-body">
            <div class="item">
              <div class="label">💰 Total adeudado</div>
              <div class="value deuda">${deudaFormateada}</div>
            </div>
            <div class="item">
              <div class="label">📅 Último mes pagado</div>
              <div class="value mes">${hermana.ultimoMes || '—'}</div>
            </div>
          </div>

          ${alertHTML}
        </div>
      `;
    }

    function mostrarLoading() {
      document.getElementById('resultado').innerHTML = `
        <div class="loading-text">
          <div class="spinner"></div>
          <span>Cargando datos de la planilla...</span>
        </div>
      `;
    }

    function mostrarError(mensaje) {
      document.getElementById('resultado').innerHTML = `
        <div class="no-result" style="border-color:#f5c6cb;">
          <div class="icono">⚠️</div>
          <p style="color:#b82a6e;">${mensaje}</p>
        </div>
      `;
    }

    async function buscar() {
      const input = document.getElementById('nombre');
      const textoIngresado = input.value.trim();
      const boton = document.getElementById('btnBuscar');

      if (!textoIngresado) {
        document.getElementById('resultado').innerHTML = `
          <div class="no-result">
            <div class="icono">✏️</div>
            <p>Por favor, escribí tu nombre de usuario.</p>
          </div>
        `;
        return;
      }

      const inputNormalizado = normalizarTexto(textoIngresado);

      boton.disabled = true;
      boton.textContent = 'Consultando...';
      mostrarLoading();

      const datos = await cargarDatos();

      if (!datos) {
        mostrarError('Error al cargar los datos. Verificá tu conexión o que la planilla esté publicada correctamente.');
        boton.disabled = false;
        boton.textContent = 'Consultar';
        return;
      }

      let hermana = datos.find(h => normalizarTexto(h.user) === inputNormalizado);
      let busquedaPorUser = true;

      if (!hermana) {
        hermana = datos.find(h => normalizarTexto(h.nombre) === inputNormalizado);
        busquedaPorUser = false;
      }

      const corazon = obtenerCorazonAleatorio();
      renderResultado(hermana, corazon, busquedaPorUser);

      boton.disabled = false;
      boton.textContent = 'Consultar';
    }

    document.getElementById('btnBuscar').addEventListener('click', buscar);

    document.getElementById('nombre').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        buscar();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('resultado').innerHTML = `
        <div class="no-result" style="border-color:transparent; background:transparent; box-shadow:none; padding:0.5rem;">
          <p style="color:#b8a4ae; font-size:0.9rem;">✨ Ingresá tu usuario y presioná "Consultar"</p>
        </div>
      `;
    });
  </script>
</body>
</html>
